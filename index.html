<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Personal Brand</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
  :root {
    --bg: #f5f4ef;
    --surface: #ffffff;
    --ink: #13141a;
    --muted: #666a75;
    --line: #dcdad2;
    --accent: #3d3bf3;
    --accent-soft: #e6e6ff;
    --on-accent: #ffffff;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0e0f14; --surface: #171922; --ink: #f1f1ee; --muted: #9a9eab;
      --line: #2a2d3a; --accent: #8e8cff; --accent-soft: #23234a; --on-accent: #0e0f14;
    }
  }
  :root[data-theme="dark"] {
    --bg: #0e0f14; --surface: #171922; --ink: #f1f1ee; --muted: #9a9eab;
    --line: #2a2d3a; --accent: #8e8cff; --accent-soft: #23234a; --on-accent: #0e0f14;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }
  html { scroll-behavior: smooth; scroll-padding-top: 72px; }
  body {
    font-family: "Pretendard Variable", Pretendard, "Segoe UI", "Malgun Gothic", "Apple SD Gothic Neo", sans-serif;
    background: var(--bg); color: var(--ink);
    line-height: 1.65; word-break: keep-all;
    -webkit-font-smoothing: antialiased;
  }
  a { color: inherit; text-decoration: none; }
  ul { list-style: none; }
  .wrap { max-width: 1080px; margin: 0 auto; padding: 0 24px; }

  /* 내비게이션 */
  nav {
    position: sticky; top: 0; z-index: 10;
    background: color-mix(in srgb, var(--bg) 85%, transparent);
    backdrop-filter: blur(12px);
    border-bottom: 1px solid var(--line);
  }
  nav .wrap { display: flex; align-items: center; justify-content: space-between; height: 60px; gap: 16px; }
  .logo { font-weight: 800; letter-spacing: -0.02em; font-size: 17px; white-space: nowrap; }
  .logo span { color: var(--accent); }
  .nav-links { display: flex; align-items: center; gap: 22px; font-size: 14px; color: var(--muted); }
  .nav-links a:hover { color: var(--ink); }
  #themeBtn {
    width: 34px; height: 34px; border-radius: 50%;
    border: 1px solid var(--line); background: var(--surface); color: var(--ink);
    cursor: pointer; font-size: 15px; flex: none;
  }
  @media (max-width: 720px) { .nav-links a { display: none; } }

  /* 히어로 */
  .hero { padding: 88px 0 56px; }
  .hero-grid { display: grid; grid-template-columns: 1fr 270px; gap: 52px; align-items: end; }
  .portrait {
    aspect-ratio: 3 / 4; border-radius: 24px; overflow: hidden;
    border: 1px solid var(--line); background: var(--surface);
    box-shadow: 14px 14px 0 var(--accent); margin: 0 14px 14px 0;
  }
  .portrait img { display: block; width: 100%; height: 100%; object-fit: cover; object-position: center top; }
  @media (max-width: 860px) {
    .hero { padding-top: 48px; }
    .hero-grid { grid-template-columns: 1fr; gap: 32px; }
    .portrait { order: -1; width: 150px; border-radius: 18px; box-shadow: 8px 8px 0 var(--accent); }
  }
  .eyebrow {
    display: inline-flex; align-items: center; gap: 8px;
    font-size: 12px; font-weight: 600; letter-spacing: 0.16em; color: var(--accent);
    text-transform: uppercase;
  }
  .eyebrow::before { content: ""; width: 28px; height: 2px; background: var(--accent); }
  .hero h1 {
    margin-top: 22px;
    font-size: clamp(34px, 5.8vw, 68px); font-weight: 800;
    line-height: 1.08; letter-spacing: -0.045em;
  }
  .hero h1 em { font-style: normal; color: var(--accent); }
  .hero .lead { margin-top: 28px; max-width: 620px; font-size: clamp(16px, 2vw, 19px); color: var(--muted); }
  .hero .lead b { color: var(--ink); font-weight: 600; }
  .roles { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 26px; }
  .roles li {
    padding: 6px 14px; border-radius: 999px; font-size: 13px; font-weight: 600;
    border: 1px solid var(--ink);
  }
  .cta { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 36px; }
  .btn {
    display: inline-flex; align-items: center; gap: 8px;
    padding: 14px 26px; border-radius: 999px; font-weight: 700; font-size: 15px;
    background: var(--ink); color: var(--bg); transition: transform .15s;
  }
  .btn:hover { transform: translateY(-2px); }
  .btn.line { background: transparent; color: var(--ink); border: 1px solid var(--ink); }

  .stats {
    display: grid; grid-template-columns: repeat(4, 1fr);
    margin-top: 72px; border-top: 2px solid var(--ink);
  }
  .stats div { padding: 20px 16px 0 0; }
  .stats b { display: block; font-size: clamp(30px, 4.6vw, 52px); font-weight: 800; letter-spacing: -0.04em; line-height: 1.1; font-variant-numeric: tabular-nums; }
  .stats b small { font-size: .45em; font-weight: 600; color: var(--muted); letter-spacing: 0; }
  .stats span { font-size: 13px; color: var(--muted); }
  @media (max-width: 640px) { .stats { grid-template-columns: repeat(2, 1fr); row-gap: 8px; } }

  /* 키워드 띠 */
  .ticker { overflow: hidden; border-block: 1px solid var(--line); padding: 14px 0; margin-top: 40px; }
  .ticker-track { display: flex; gap: 40px; width: max-content; animation: slide 36s linear infinite; }
  .ticker span { font-size: 14px; font-weight: 600; letter-spacing: 0.08em; color: var(--muted); white-space: nowrap; }
  .ticker span::after { content: "✦"; margin-left: 40px; color: var(--accent); }
  @keyframes slide { to { transform: translateX(-50%); } }

  /* 섹션 공통 */
  section.wrap { padding-top: 136px; }
  @media (max-width: 720px) { section.wrap { padding-top: 96px; } }
  .sec-head { display: flex; align-items: baseline; gap: 16px; margin-bottom: 44px; }
  .sec-head .no { font-size: 13px; font-weight: 700; color: var(--accent); letter-spacing: 0.1em; }
  .sec-head h2 { font-size: clamp(26px, 4vw, 40px); font-weight: 800; letter-spacing: -0.035em; line-height: 1.2; }
  .sec-desc { margin: -28px 0 40px; color: var(--muted); max-width: 640px; }

  /* 강점 */
  .pillars { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; }
  @media (max-width: 1000px) { .pillars { grid-template-columns: repeat(2, 1fr); } }
  .pillar {
    background: var(--surface); border: 1px solid var(--line); border-radius: 20px;
    padding: 28px 26px; display: flex; flex-direction: column;
  }
  .pillar .k { font-size: 12px; font-weight: 700; letter-spacing: 0.14em; color: var(--accent); }
  .pillar h3 { margin: 10px 0 12px; font-size: 22px; font-weight: 800; letter-spacing: -0.03em; line-height: 1.3; }
  .pillar p { color: var(--muted); font-size: 15px; }
  .pillar ul { margin-top: 20px; padding-top: 16px; border-top: 1px dashed var(--line); font-size: 14px; }
  .pillar li { padding: 3px 0 3px 16px; position: relative; }
  .pillar li::before { content: ""; position: absolute; left: 0; top: 13px; width: 6px; height: 6px; border-radius: 50%; background: var(--accent); }
  @media (max-width: 600px) { .pillars { grid-template-columns: 1fr; } }

  /* 경력 타임라인 */
  .timeline { border-left: 2px solid var(--line); margin-left: 6px; }
  .tl-item { position: relative; padding: 0 0 36px 30px; }
  .tl-item:last-child { padding-bottom: 0; }
  .tl-item::before {
    content: ""; position: absolute; left: -8px; top: 6px;
    width: 14px; height: 14px; border-radius: 50%;
    background: var(--bg); border: 3px solid var(--accent);
  }
  .tl-date { font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }
  .tl-item h3 { font-size: 20px; font-weight: 800; letter-spacing: -0.02em; margin-top: 2px; }
  .tl-org { font-size: 14px; font-weight: 600; color: var(--accent); }
  .tl-item ul.desc { margin-top: 10px; font-size: 15px; color: var(--muted); }
  .tl-item ul.desc li { padding-left: 14px; position: relative; }
  .tl-item ul.desc li::before { content: "–"; position: absolute; left: 0; }

  .tags { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 12px; }
  .tags li { font-size: 12px; font-weight: 600; padding: 3px 10px; border-radius: 999px; background: var(--accent-soft); color: var(--accent); }

  /* 프로젝트 */
  .filters { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 24px; }
  .filters button {
    font: inherit; font-size: 14px; font-weight: 600; cursor: pointer;
    padding: 8px 16px; border-radius: 999px;
    border: 1px solid var(--line); background: transparent; color: var(--muted);
  }
  .filters button.on { background: var(--ink); border-color: var(--ink); color: var(--bg); }
  .filters button .n { opacity: .6; margin-left: 4px; font-variant-numeric: tabular-nums; }
  .projects { display: grid; grid-template-columns: repeat(2, 1fr); gap: 16px; }
  .card {
    background: var(--surface); border: 1px solid var(--line); border-radius: 20px;
    padding: 24px; display: flex; flex-direction: column;
    transition: transform .18s, border-color .18s;
  }
  .card:hover { transform: translateY(-3px); border-color: var(--accent); }
  .card.hide { display: none; }
  .card-top { display: flex; justify-content: space-between; gap: 12px; font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
  .card-top .role { font-weight: 700; color: var(--accent); text-align: right; }
  .card h3 { margin: 10px 0 8px; font-size: 18px; font-weight: 800; letter-spacing: -0.02em; line-height: 1.4; }
  .card p { font-size: 14.5px; color: var(--muted); flex: 1; }
  .award-badge {
    display: inline-block; margin-top: 12px; align-self: flex-start;
    font-size: 12px; font-weight: 700; padding: 4px 10px; border-radius: 6px;
    background: var(--ink); color: var(--bg);
  }
  @media (max-width: 760px) { .projects { grid-template-columns: 1fr; } }

  /* 2단 목록 (연구·수상 / 학력·자격) */
  .two { display: grid; grid-template-columns: 1fr 1fr; gap: 48px; }
  @media (max-width: 760px) { .two { grid-template-columns: 1fr; gap: 40px; } }
  .two h3.sub { font-size: 13px; font-weight: 700; letter-spacing: 0.12em; color: var(--muted); margin-bottom: 6px; }
  .rows li { padding: 16px 0; border-bottom: 1px solid var(--line); }
  .rows .t { font-weight: 700; font-size: 16px; letter-spacing: -0.01em; line-height: 1.45; }
  .rows .m { font-size: 13px; color: var(--muted); margin-top: 2px; font-variant-numeric: tabular-nums; }

  /* 연락처 */
  .contact {
    margin-top: 136px; background: var(--ink); color: var(--bg);
    border-radius: 28px; padding: clamp(36px, 6vw, 72px);
  }
  .contact h2 { font-size: clamp(28px, 5vw, 54px); font-weight: 800; letter-spacing: -0.04em; line-height: 1.15; }
  .contact p { margin-top: 14px; opacity: .7; max-width: 520px; }
  .contact-links { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 30px; }
  .contact-links a {
    padding: 12px 22px; border-radius: 999px; font-weight: 700; font-size: 15px;
    border: 1px solid color-mix(in srgb, var(--bg) 40%, transparent);
  }
  .contact-links a:hover { background: var(--bg); color: var(--ink); }
  .contact-links a.todo { border-style: dashed; opacity: .55; pointer-events: none; }

  footer { padding: 36px 0 48px; font-size: 13px; color: var(--muted); text-align: center; }

  /* 스크롤 등장 */
  .reveal { opacity: 0; transform: translateY(18px); transition: opacity .6s, transform .6s; }
  .reveal.in { opacity: 1; transform: none; }
  @media (prefers-reduced-motion: reduce) {
    .reveal { opacity: 1; transform: none; transition: none; }
    .ticker-track { animation: none; }
    html { scroll-behavior: auto; }
  }
</style>
</head>
<body>

<nav>
  <div class="wrap">
    <a href="#top" class="logo" id="logo"></a>
    <div class="nav-links">
      <a href="#about">A to Z</a>
      <a href="#experience">경력</a>
      <a href="#projects">프로젝트</a>
      <a href="#research">연구·수상</a>
      <a href="#contact">연락처</a>
      <button id="themeBtn" aria-label="테마 전환">◐</button>
    </div>
  </div>
</nav>

<main id="top">
  <header class="hero wrap">
    <div class="hero-grid">
      <div>
        <div class="eyebrow" id="eyebrow"></div>
        <h1 id="headline"></h1>
        <p class="lead" id="lead"></p>
        <ul class="roles" id="roles"></ul>
        <div class="cta">
          <a class="btn" href="#projects">프로젝트 보기 ↓</a>
          <a class="btn line" href="#contact">연락하기</a>
        </div>
      </div>
      <figure class="portrait" id="portrait"></figure>
    </div>
    <div class="stats" id="stats"></div>
  </header>

  <div class="ticker" aria-hidden="true"><div class="ticker-track" id="ticker"></div></div>

  <section id="about" class="wrap">
    <div class="sec-head reveal"><span class="no">01</span><h2>기획부터 배포까지, A to Z</h2></div>
    <p class="sec-desc reveal">문제를 찾는 일부터 동작하는 서비스로 내놓는 일까지, 한 사람이 끝까지 책임질 수 있도록 단계마다 경험을 쌓았습니다.</p>
    <div class="pillars" id="pillars"></div>
  </section>

  <section id="experience" class="wrap">
    <div class="sec-head reveal"><span class="no">02</span><h2>경력</h2></div>
    <div class="timeline" id="timeline"></div>
  </section>

  <section id="projects" class="wrap">
    <div class="sec-head reveal"><span class="no">03</span><h2>프로젝트 &amp; 활동</h2></div>
    <div class="filters" id="filters"></div>
    <div class="projects" id="projectGrid"></div>
  </section>

  <section id="research" class="wrap">
    <div class="sec-head reveal"><span class="no">04</span><h2>연구 &amp; 수상</h2></div>
    <div class="two">
      <div class="reveal"><h3 class="sub">논문</h3><ul class="rows" id="papers"></ul></div>
      <div class="reveal"><h3 class="sub">수상</h3><ul class="rows" id="awards"></ul></div>
    </div>
  </section>

  <section id="education" class="wrap">
    <div class="sec-head reveal"><span class="no">05</span><h2>학력 &amp; 자격</h2></div>
    <div class="two">
      <div class="reveal"><h3 class="sub">학력</h3><ul class="rows" id="education-list"></ul></div>
      <div class="reveal"><h3 class="sub">자격증</h3><ul class="rows" id="certs"></ul></div>
    </div>
    <div class="reveal" style="margin-top:40px">
      <h3 class="sub" style="font-size:13px;font-weight:700;letter-spacing:.12em;color:var(--muted);margin-bottom:6px">봉사활동</h3>
      <ul class="rows" id="volunteer"></ul>
    </div>
  </section>

  <div class="wrap">
    <section id="contact" class="contact reveal" style="padding-top:clamp(36px, 6vw, 72px)">
      <h2 id="contactTitle"></h2>
      <p id="contactText"></p>
      <div class="contact-links" id="contactLinks"></div>
    </section>
  </div>
</main>

<footer><div class="wrap" id="footer"></div></footer>
